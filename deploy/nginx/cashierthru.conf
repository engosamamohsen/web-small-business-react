# Production Nginx config for the multi-tenant cashierthru storefront.
#
# ONE server block serves EVERY tenant subdomain. The Astro app derives the
# tenant (and its admin API) from the forwarded Host header — see
# src/middleware.ts (SSR) and src/lib/config.ts (browser):
#
#   asly.cashierthru.com    → API https://admin-asly.cashierthru.com/api/
#   roka.cashierthru.com    → API https://admin-roka.cashierthru.com/api/
#   <any>.cashierthru.com   → API https://admin-<any>.cashierthru.com/api/
#
# A new tenant works the moment its admin API exists — no redeploy, no edit here.
#
# Prerequisites (see deploy/README.md):
#   1. Wildcard DNS:   *.cashierthru.com  A  <server-ip>
#   2. Wildcard cert:  certbot certonly --manual --preferred-challenges dns \
#                        -d cashierthru.com -d "*.cashierthru.com"
#   3. The Astro SSR server running on 127.0.0.1:3000
#      (pm2 start ecosystem.config.cjs)

# ── HTTP → HTTPS for any tenant subdomain ──────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name ~^(?!admin)(?!www)[\w-]+\.cashierthru\.com$;
    return 301 https://$host$request_uri;
}

# ── HTTPS — any tenant subdomain (excludes admin-* and www) ─────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    # Regex server_name matches ANY single-label subdomain. This is what makes
    # the setup dynamic: asly, roka, and every future shop all match here.
    server_name ~^(?!admin)(?!www)[\w-]+\.cashierthru\.com$;

    # Wildcard certificate — valid for every *.cashierthru.com
    ssl_certificate     /etc/letsencrypt/live/cashierthru.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cashierthru.com/privkey.pem;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # THE critical lines. Without these the app sees host "127.0.0.1",
        # can't tell the tenant apart, and every subdomain falls back to the
        # single PUBLIC_BASE_URL in .env (the bug where asly called roka's API).
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # OPTIONAL: let Nginx serve hashed static assets straight from disk instead
    # of proxying them to Node. The standalone server already serves them, so
    # this is only a performance tweak. Adjust the path to your clone, then
    # uncomment.
    # location /_astro/ {
    #     alias /var/www/web-small-business-react/dist/client/_astro/;
    #     expires 1y;
    #     access_log off;
    #     add_header Cache-Control "public, immutable";
    # }
}
